[package]
name = "agent-mark-hub"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"
aes-gcm = "0.10"
pbkdf2 = "0.12"
base64 = "0.22"

[features]
# `custom-protocol` tells tauri-build NOT to define the `dev` cfg alias, so the frontend
# assets in `build.frontendDist` are embedded into the exe instead of loading `devUrl`
# (http://localhost:1420). It is on by default: build.ps1 calls plain `cargo build`, and a
# plain build must produce a self-contained app. Use `--no-default-features` to get the
# dev-URL behaviour back (e.g. while iterating on the UI with a local server).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
