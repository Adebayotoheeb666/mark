name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Reference implementation tests
        run: python -m pytest engine hub relay app -q

      - name: Validate schemas + demo fixtures
        run: python scripts/validate_demo.py

      - name: Pack sign/verify round-trip
        run: python scripts/pack_sign_verify.py

      - name: JSON parses
        run: |
          python - <<'PY'
          import json
          for f in ["schemas/pack_manifest.json", "schemas/score_batch.json",
                    "website/version.json", "website/vercel.json",
                    "website/app/manifest.webmanifest"]:
              json.load(open(f, encoding="utf-8"))
          print("json: OK")
          PY

      - name: Committed artifacts match version.json
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("website")
          v = json.loads((root / "version.json").read_text(encoding="utf-8"))
          for key in ("installer", "msi", "portable"):
              art = v["windows"][key]
              data = (root / art["file"]).read_bytes()
              assert len(data) == art["bytes"], f"{key}: size mismatch"
              assert hashlib.sha256(data).hexdigest().upper() == art["sha256"], f"{key}: hash mismatch"
          print("checksums: OK")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend syntax
        run: |
          node --check website/app/app.js
          node --check website/app/sw.js
          node --check website/assets/site.js

  desktop-windows:
    # Builds the real Windows artifacts on a clean MSVC runner. The local machine
    # uses the GNU + Zig bridge in .cargo/config.toml; that section is ignored here
    # because the runner's host target is x86_64-pc-windows-msvc.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hub-desktop/src-tauri

      - name: Install Tauri CLI
        working-directory: hub-desktop
        run: npm ci

      - name: Build NSIS + MSI
        working-directory: hub-desktop
        run: npx tauri build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: agent-mark-hub-windows
          path: |
            hub-desktop/src-tauri/target/release/bundle/nsis/*.exe
            hub-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android-apk:
    # Wraps the canonical PWA (website/app) in a Capacitor Android shell. This is
    # the companion preview, not the Rust hub: no sync, no signing, no audit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ubuntu-latest already ships the Android SDK (platform 36, build-tools 36,
      # platform-tools) and ANDROID_HOME; no third-party setup action is needed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | sort -V | tail -3
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -3

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Copy PWA assets
        working-directory: mobile
        run: npm run sync-web

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-mark-mobile-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
