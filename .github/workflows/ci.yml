name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Reference implementation tests
        run: python -m pytest engine hub relay app -q

      - name: Validate schemas + demo fixtures
        run: python scripts/validate_demo.py

      - name: Pack sign/verify round-trip
        run: python scripts/pack_sign_verify.py

      - name: JSON parses
        run: |
          python - <<'PY'
          import json
          for f in ["schemas/pack_manifest.json", "schemas/score_batch.json",
                    "website/version.json", "website/vercel.json",
                    "website/app/manifest.webmanifest"]:
              json.load(open(f, encoding="utf-8"))
          print("json: OK")
          PY

      - name: Committed artifacts match version.json
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("website")
          v = json.loads((root / "version.json").read_text(encoding="utf-8"))
          for key in ("installer", "msi", "portable"):
              art = v["windows"][key]
              data = (root / art["file"]).read_bytes()
              assert len(data) == art["bytes"], f"{key}: size mismatch"
              assert hashlib.sha256(data).hexdigest().upper() == art["sha256"], f"{key}: hash mismatch"
          print("checksums: OK")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend syntax
        run: |
          node --check website/app/app.js
          node --check website/app/sw.js
          node --check website/assets/site.js

  desktop-windows:
    # Builds the real Windows artifacts on a clean MSVC runner. The local machine
    # uses the GNU + Zig bridge in .cargo/config.toml; that section is ignored here
    # because the runner's host target is x86_64-pc-windows-msvc.
    runs-on: windows-latest
    env:
      AGM_WINDOWS_PFX_BASE64: ${{ secrets.AGM_WINDOWS_PFX_BASE64 }}
      AGM_WINDOWS_PFX_PASSWORD: ${{ secrets.AGM_WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hub-desktop/src-tauri

      - name: Install Tauri CLI
        working-directory: hub-desktop
        run: npm ci

      - name: Rust tests
        working-directory: hub-desktop/src-tauri
        run: cargo test

      - name: Build NSIS + MSI
        working-directory: hub-desktop
        run: npx tauri build --bundles nsis,msi

      - name: Sign Windows installers (optional)
        if: env.AGM_WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $pfx = Join-Path $env:RUNNER_TEMP "agentmark-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AGM_WINDOWS_PFX_BASE64))
          Get-ChildItem hub-desktop/src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi |
            ForEach-Object {
              & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:AGM_WINDOWS_PFX_PASSWORD `
                /tr http://timestamp.digicert.com /td SHA256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.FullName)" }
            }
          Remove-Item $pfx -Force

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: agent-mark-hub-windows
          path: |
            hub-desktop/src-tauri/target/release/bundle/nsis/*.exe
            hub-desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android-apk:
    # Wraps the canonical PWA (website/app) in a Capacitor Android shell. The companion holds only
    # the passcode-encrypted local store (AES-256-GCM + PBKDF2) with an encrypted .agmm export to the
    # desktop hub. No relay sync, no cloud storage, no signing, no audit for the companion itself.
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed only for the tag-triggered GitHub Release below
    env:
      AGM_ANDROID_KEYSTORE_BASE64: ${{ secrets.AGM_ANDROID_KEYSTORE_BASE64 }}
      AGM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.AGM_ANDROID_KEYSTORE_PASSWORD }}
      AGM_ANDROID_KEY_ALIAS: ${{ secrets.AGM_ANDROID_KEY_ALIAS }}
      AGM_ANDROID_KEY_PASSWORD: ${{ secrets.AGM_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ubuntu-latest already ships the Android SDK (platform 36, build-tools 36,
      # platform-tools) and ANDROID_HOME; no third-party setup action is needed.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | sort -V | tail -3
          ls "$ANDROID_HOME/build-tools" | sort -V | tail -3

      - name: Install Capacitor
        working-directory: mobile
        run: npm ci

      - name: Copy PWA assets
        working-directory: mobile
        run: npm run sync-web

      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Harden Android companion (no backups, no screenshots)
        working-directory: mobile
        run: node scripts/patch_android_hardening.js

      - name: Configure release signing
        if: env.AGM_ANDROID_KEYSTORE_BASE64 != ''
        working-directory: mobile
        run: |
          printf '%s' "$AGM_ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          node scripts/configure-android-signing.js

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK (signed)
        if: env.AGM_ANDROID_KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        env:
          AGM_KEYSTORE_PATH: release.keystore
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        id: stage
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            ASSET="Agent-Mark-Mobile-${VERSION}.apk"
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "$ASSET"
            SIGNED="release-signed"
          else
            ASSET="Agent-Mark-Mobile-${VERSION}-debug.apk"
            cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "$ASSET"
            SIGNED="debug-signed preview"
          fi
          SHA="$(sha256sum "$ASSET" | awk '{print $1}')"
          echo "$SHA" > apk.sha256
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"
          ls -lh "$ASSET"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-mark-mobile-apk
          path: ${{ steps.stage.outputs.asset }}
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > release-notes.md <<EOF
          Agent Mark mobile companion ${GITHUB_REF_NAME} - **${{ steps.stage.outputs.signed }} APK**.

          This is the offline PWA companion wrapped with Capacitor, not the Rust hub.

          - Passcode + AES-256-GCM encrypted local store, auto-lock, and encrypted `.agmm` transfer.
          - No cloud relay, no always-on sync, no telemetry. Real-data mode is gated in the app.
          - Printing is a desktop-hub feature. Import the `.agmm` file into the desktop hub.
          - Install with "Install unknown apps" allowed. Android 7+.
          - Source: https://github.com/Adebayotoheeb666/mark/tree/${GITHUB_REF_NAME}/mobile
          - SHA-256: ${{ steps.stage.outputs.sha }}
          EOF
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.stage.outputs.asset }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "Agent Mark ${GITHUB_REF_NAME#v} - mobile APK (pilot)" \
              --notes-file release-notes.md \
              --prerelease
          fi
